server {
    listen 80; # Escuta na porta 80
    server_name localhost; # Define o nome do servidor

    location / {
        root   /usr/share/nginx/html; # Diretório raiz dos arquivos estáticos
        try_files $uri $uri/ /index.html; # Tenta servir arquivos ou redireciona para index.html
        index  index.html index.htm; # Arquivos de índice padrão
    }

    # location /api/ {
