<svg viewBox="0 0 300 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .lib-text { animation: slideIn 0.8s ease-out; }
    </style>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4338CA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Decorative elements -->
  <circle cx="15" cy="60" r="4" fill="#4338CA" opacity="0.3"/>
  <circle cx="25" cy="35" r="3" fill="#22D3EE" opacity="0.4"/>
  <circle cx="35" cy="85" r="2.5" fill="#7C3AED" opacity="0.35"/>
  
  <!-- Main text "LIBRARY" -->
  <text x="60" y="90" font-family="'Roboto', sans-serif" font-size="72" font-weight="700" 
        fill="url(#textGradient)" letter-spacing="2" filter="url(#glow)" class="lib-text">LIBRARY</text>
  
  <!-- Accent underline -->
  <line x1="60" y1="105" x2="280" y2="105" stroke="url(#textGradient)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Floating dots decoration -->
  <circle cx="285" cy="50" r="3" fill="#22D3EE" opacity="0.5"/>
  <circle cx="290" cy="70" r="2" fill="#4338CA" opacity="0.4"/>
</svg>