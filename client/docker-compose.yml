services:
   react-app:
    image: celisapp/react-app
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://rest-with-spring-boot-erudio:8080
    environment:
      - REACT_APP_API_URL=$REACT_APP_API_URL
    ports:
      - "80:80"
    expose:
      - 80

