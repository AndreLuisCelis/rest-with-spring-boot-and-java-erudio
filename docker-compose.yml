version: '3.9'
services:
  db:
    image: mysql:8.0.29
    command: mysqld --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_USER: docker
      MYSQL_PASSWORD: admin123
      MYSQL_DATABASE: rest_with_spring_boot_erudio
      MYSQL_ROOT_HOST: '%'
      MYSQL_TCP_PORT: 3308
    ports:
      - 3308:3308
    expose:
      - 3308
    networks:
      - erudio-network
    volumes:
      - db:/data/db

  rest-with-spring-boot-erudio:
    image: celisapp/rest-with-spring-boot-erudio
    restart: always
    build:
      context: ./server
      dockerfile: Dockerfile.build
    working_dir: /app
    environment:
      TZ: America/Sao_Paulo
      SPRING.DATASOURCE.URL: jdbc:mysql://db:3308/rest_with_spring_boot_erudio?useTimezone=true&serverTimezone=UTC
      SPRING.DATASOURCE.USERNAME: root
      SPRING.DATASOURCE.PASSWORD: admin123
    ports:
      - 80:8080
    expose:
      - 80
    depends_on:
      - db
    networks:
      - erudio-network
    volumes:
      - uploads:/user/uploads

  react-app:
    image: celisapp/react-app
    restart: always
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost
    environment:
      - REACT_APP_API_URL=http://localhost
    ports:
      - "5000:80"
    expose:
      - 5000
    depends_on:
      - rest-with-spring-boot-erudio
    networks:
      - erudio-network

networks:
  erudio-network:
    driver: bridge

volumes:
  db:
  uploads:
